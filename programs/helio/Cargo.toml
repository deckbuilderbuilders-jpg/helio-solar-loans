[package]
name = "helio"
version = "0.1.0"
description = "HELIO — fixed-term USDC loans against Illinois solar takeouts"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "helio"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
